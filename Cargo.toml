[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Principal Systems Architecture Team"]
repository = "https://github.com/org/sysdesign-sim"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance", "Window"] }
console_error_panic_hook = "0.1"
